name: Update rule sets

on:
  schedule:
    # 每天 03:17 UTC = 北京时间 11:17，避开整点拥堵
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rebuild rule sets from upstream
        run: python scripts/build.py

      - name: Commit and tag when something changed
        id: commit
        run: |
          if git diff --quiet; then
            echo "上游无变化，跳过"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rules/
          git commit -m "chore: refresh rule sets from MetaCubeX/meta-rules-dat"
          # 打时间戳 tag：jsDelivr 对 tag 的缓存策略比 branch 更可控
          TAG="v$(date -u +%Y.%m.%d)"
          git tag -f "$TAG"
          git push
          git push -f origin "$TAG"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # jsDelivr 对 @main 这类分支引用有约 12 小时缓存。不主动 purge 的话，客户端在
      # 规则刷新后仍会长时间读到上一版（实测踩到：仓库已是 v3，CDN 还在发 v2）。
      - name: Purge jsDelivr cache
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: |
          for f in rules/*.json; do
            name=$(basename "$f")
            printf 'purge %s ... ' "$name"
            curl -sS --max-time 180 \
              "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@main/rules/${name}" \
              -o /dev/null && echo ok || echo failed
          done
